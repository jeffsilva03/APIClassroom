[project]
name = "apiclassroom"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.157.0",
  "uvicorn==0.54.0",
  "google-auth==2.62.0",
  "requests==2.34.2",
  "httpx==0.28.1",
  "pypdf==6.21.2",
  "mcp==2.3.0",
  "pyjwt==2.15.1",
  "cryptography==50.0.2",
  "tzdata==2026.5",
]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
